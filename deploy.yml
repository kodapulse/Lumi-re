name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          # "/" si le dépôt s'appelle <utilisateur>.github.io, sinon "/<nom-du-depot>/"
          VITE_BASE_PATH: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
          VITE_BASE44_SERVER_URL: ${{ vars.VITE_BASE44_SERVER_URL }}
          VITE_TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.VITE_TMDB_API_READ_ACCESS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
